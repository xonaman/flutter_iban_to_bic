include: package:lints/recommended.yaml

# Kept in sync with the flutter tool's AnalysisOptionsMigration, which
# rewrites a Flutter package's analysis_options.yaml during `flutter pub get`
# unless every entry is already present -- and a rewritten file fails
# `dart pub publish --dry-run`. The package itself is pure Dart now, but
# example/ is still a Flutter app.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    prefer_single_quotes: true
    prefer_final_locals: true
    always_specify_types: true
