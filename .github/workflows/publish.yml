name: Publish to pub.dev

on:
  push:
    tags:
      # Match semver tags like v1.0.0, v1.2.3-beta.1, etc.
      - 'v[0-9]+.[0-9]+.[0-9]+*'

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    permissions:
      # Required for pub.dev trusted-publisher OIDC.
      id-token: write
      # Required to create the GitHub release.
      contents: write

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # setup-dart wires the GitHub OIDC token into the pub credential
      # file so `dart pub publish` can exchange it with pub.dev without
      # any interactive auth. Without this step, publish falls through
      # to the Google OAuth prompt and hangs forever.
      - name: Set up Dart (trusted publishing)
        uses: dart-lang/setup-dart@v1

      - name: Install dependencies
        run: flutter pub get

      - name: Verify tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PUBSPEC_VERSION="$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          if [ "$TAG" != "$PUBSPEC_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match pubspec version $PUBSPEC_VERSION"
            exit 1
          fi
          echo "Tag and pubspec version agree: $PUBSPEC_VERSION"

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests
        run: flutter test

      - name: Dry run
        run: dart pub publish --dry-run

      # Runs before publishing so a missing CHANGELOG entry stops the
      # release instead of leaving pub.dev ahead of GitHub.
      - name: Extract release notes from CHANGELOG
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## $VERSION" '
            $0 == heading { found = 1; next }
            found && /^## / { exit }
            found && /^<!--.*-->$/ { next }
            found { print }
          ' CHANGELOG.md > "$RUNNER_TEMP/release_notes.md"
          if ! grep -q '[^[:space:]]' "$RUNNER_TEMP/release_notes.md"; then
            echo "::error::No CHANGELOG.md entry found for $VERSION"
            exit 1
          fi

      - name: Publish
        run: dart pub publish --force

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Tags like v1.2.3-beta.1 become GitHub pre-releases.
          PRERELEASE=""
          case "$GITHUB_REF_NAME" in *-*) PRERELEASE="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "$GITHUB_REF_NAME" \
            --notes-file "$RUNNER_TEMP/release_notes.md" \
            --verify-tag \
            $PRERELEASE
