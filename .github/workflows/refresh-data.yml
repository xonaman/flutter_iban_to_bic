name: Refresh bank-code datasets

on:
  schedule:
    # Every Monday 04:00 UTC. Bundesbank publishes quarterly; other sources
    # are mostly monthly — weekly is a good compromise between freshness and
    # CI noise.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      countries:
        description: 'Space-separated country codes (blank = all)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Dart (stable)
        uses: dart-lang/setup-dart@v1

      # --no-example: example/ is a Flutter app and needs the Flutter SDK.
      - name: Install dependencies
        run: dart pub get --no-example

      - name: Run refresh script
        env:
          # Optional override. When unset, the script reads the current file's
          # URL off the Bundesbank download page.
          BUNDESBANK_BLZ_URL: ${{ vars.BUNDESBANK_BLZ_URL }}
        run: |
          dart run tool/refresh_data.dart ${{ inputs.countries }}

      - name: Run tests against refreshed data
        run: dart test

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- data/bank_codes lib/src/data \
            && [ -z "$(git ls-files --others --exclude-standard -- data/bank_codes lib/src/data)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Summarise changed bank codes
        if: steps.diff.outputs.changed == 'true'
        run: |
          {
            echo 'Automated refresh from the upstream authoritative sources.'
            echo
            echo 'Generated by `.github/workflows/refresh-data.yml` using'
            echo '`tool/refresh_data.dart`. Tests were run against the new data'
            echo 'before this PR was opened. Review the changes in'
            echo '`data/bank_codes/`; `lib/src/data/` is generated from it.'
            echo
            echo '## Changes'
            echo
            dart run tool/summarize_changes.dart
          } > "$RUNNER_TEMP/pr-body.md"

      - name: Open PR with refreshed data
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/refresh-bank-codes
          title: 'chore: refresh bank-code datasets'
          commit-message: 'chore: refresh bank-code datasets'
          body-path: ${{ runner.temp }}/pr-body.md
          labels: data-refresh
          delete-branch: true
