name: Refresh bank-code datasets

on:
  schedule:
    # Every Monday 04:00 UTC. Bundesbank publishes quarterly; other sources
    # are mostly monthly — weekly is a good compromise between freshness and
    # CI noise.
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      countries:
        description: 'Space-separated country codes (blank = all)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write
  # Open, update and close the tracking issue for skipped/failed refreshes.
  issues: write

# Serialize runs so overlapping scheduled and manual runs can't open
# duplicate tracking issues or race on the refresh PR branch. The running
# job is never cancelled, but GitHub keeps only one pending run per group:
# a newer queued run replaces an older pending one. Weekly runs take a few
# minutes, so in practice only a manual run started during another run can
# be dropped; start it again once the current run finishes.
concurrency:
  group: refresh-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      # Runs first so the tracking-issue step knows whether this is a full
      # run even if checkout or setup fails. Whitespace-only input also
      # refreshes everything, so decide this from the parsed list rather
      # than the raw input.
      - name: Classify run scope
        id: scope
        env:
          COUNTRIES: ${{ inputs.countries }}
        run: |
          read -r -a countries <<< "$COUNTRIES"
          if [ "${#countries[@]}" -eq 0 ]; then
            echo 'all_countries=true' >> "$GITHUB_OUTPUT"
          fi

      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Run refresh script
        env:
          # Optional override. When unset, the script reads the current file's
          # URL off the Bundesbank download page.
          BUNDESBANK_BLZ_URL: ${{ vars.BUNDESBANK_BLZ_URL }}
          # Passed through env (not interpolated into the script) so the
          # input can't inject shell commands.
          COUNTRIES: ${{ inputs.countries }}
        run: |
          read -r -a countries <<< "$COUNTRIES"
          for cc in "${countries[@]}"; do
            if [[ ! "$cc" =~ ^[A-Za-z]{2}$ ]]; then
              echo "::error::Invalid country code: $cc"
              exit 64
            fi
          done
          dart run tool/refresh_data.dart \
            --summary-json="$RUNNER_TEMP/refresh-summary.json" \
            --summary-markdown="$RUNNER_TEMP/refresh-summary.md" \
            "${countries[@]}"

      - name: Publish refresh summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/refresh-summary.md" ]; then
            {
              echo '## Data refresh'
              echo
              cat "$RUNNER_TEMP/refresh-summary.md"
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Run tests against refreshed data
        run: flutter test

      - name: Detect changes
        id: diff
        run: |
          if git diff --quiet -- assets/bank_codes; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR with refreshed data
        if: steps.diff.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v8
        with:
          branch: chore/refresh-bank-codes
          title: 'chore: refresh bank-code datasets'
          commit-message: 'chore: refresh bank-code datasets'
          body: |
            Automated refresh from the upstream authoritative sources.

            Generated by `.github/workflows/refresh-data.yml` using
            `tool/refresh_data.dart`. Tests were run against the new data
            before this PR was opened.
          labels: data-refresh
          delete-branch: true

      # Runs for scheduled runs (even if an early step failed) and manual
      # runs over all countries, so a partial manual run can't close the
      # issue. Any failed step (including the tests above or the PR
      # creation) also counts as needing attention.
      - name: Update tracking issue
        if: >-
          always() && (github.event_name == 'schedule' ||
          steps.scope.outputs.all_countries == 'true')
        env:
          GH_TOKEN: ${{ github.token }}
          JOB_STATUS: ${{ job.status }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          summary_json="$RUNNER_TEMP/refresh-summary.json"
          summary_md="$RUNNER_TEMP/refresh-summary.md"
          title='Scheduled data refresh needs attention'

          adapters_ok=false
          if [ -f "$summary_json" ] &&
            [ "$(jq -r '.needsAttention' "$summary_json")" = 'false' ]; then
            adapters_ok=true
          fi
          needs_attention=true
          if [ "$adapters_ok" = 'true' ] && [ "$JOB_STATUS" = 'success' ]; then
            needs_attention=false
          fi

          issue=$(gh issue list --repo "$GITHUB_REPOSITORY" \
            --label data-refresh --state open --json number,title \
            --jq "map(select(.title == \"$title\")) | first | .number // empty")

          if [ "$needs_attention" = 'true' ]; then
            {
              if [ "$adapters_ok" = 'true' ]; then
                echo "Every country with an adapter refreshed, but a later step"
                echo "of the [data refresh run]($RUN_URL) failed (job status:"
                echo '`'"$JOB_STATUS"'`). Check the tests and PR creation steps.'
              else
                echo "The [data refresh run]($RUN_URL) did not refresh every"
                echo 'country with an adapter (job status: `'"$JOB_STATUS"'`).'
              fi
              echo
              if [ -f "$summary_md" ]; then
                cat "$summary_md"
              else
                echo 'The refresh script wrote no summary; see the run log.'
              fi
              echo
              echo 'This issue closes automatically after the next fully'
              echo 'successful refresh.'
            } > "$RUNNER_TEMP/issue-body.md"

            if [ -n "$issue" ]; then
              gh issue comment "$issue" --repo "$GITHUB_REPOSITORY" \
                --body-file "$RUNNER_TEMP/issue-body.md"
            else
              gh label create data-refresh --repo "$GITHUB_REPOSITORY" \
                --color 0E8A16 \
                --description 'Automated bank-code data refresh' \
                2>/dev/null || true
              gh issue create --repo "$GITHUB_REPOSITORY" \
                --title "$title" --label data-refresh \
                --body-file "$RUNNER_TEMP/issue-body.md"
            fi
          elif [ -n "$issue" ]; then
            gh issue close "$issue" --repo "$GITHUB_REPOSITORY" \
              --comment "Resolved: [this refresh run]($RUN_URL) succeeded for every country with an adapter."
          fi
