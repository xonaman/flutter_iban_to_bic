name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Flutter ${{ matrix.channel }}${{ matrix.version && format(' {0}', matrix.version) || '' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Listed explicitly: an `include` entry that only adds `version`
        # would be merged into the plain stable job instead of adding one.
        include:
          - channel: stable
          - channel: beta
          # Oldest Flutter allowed by pubspec.yaml's environment constraint.
          - channel: stable
            version: 3.32.0

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Flutter (${{ matrix.channel }})
        uses: subosito/flutter-action@v2
        with:
          channel: ${{ matrix.channel }}
          flutter-version: ${{ matrix.version }}
          cache: true

      - name: Print Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      - name: Verify formatting
        if: ${{ !matrix.version }}
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

      - name: Run tests with coverage
        run: flutter test --coverage

      - name: Upload coverage artifact
        if: matrix.channel == 'stable' && !matrix.version
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: pub publish --dry-run
        if: matrix.channel == 'stable' && !matrix.version
        run: dart pub publish --dry-run

      - name: Build example (web)
        if: matrix.channel == 'stable' && !matrix.version
        working-directory: example
        run: |
          flutter pub get
          flutter build web --no-tree-shake-icons
