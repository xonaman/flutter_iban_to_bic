name: CI

permissions:
  contents: read

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Dart ${{ matrix.sdk }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 3.8.0 is the oldest SDK allowed by pubspec.yaml's environment
        # constraint.
        sdk: [stable, beta, 3.8.0]

    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Dart (${{ matrix.sdk }})
        uses: dart-lang/setup-dart@v1
        with:
          sdk: ${{ matrix.sdk }}

      - name: Print Dart version
        run: dart --version

      # --no-example: example/ is a Flutter app and needs the Flutter SDK.
      - name: Install dependencies
        run: dart pub get --no-example

      - name: Verify formatting
        if: matrix.sdk != '3.8.0'
        run: dart format --output=none --set-exit-if-changed .

      - name: Check generated bank-code datasets are up to date
        run: dart run tool/build_assets.dart --check

      # The example is a Flutter app and is analyzed in the example job.
      - name: Analyze
        run: dart analyze --fatal-infos lib test tool

      - name: Run tests (VM)
        run: dart test

      # Exercises the deferred per-country dataset loading under dart2js
      # and dart2wasm.
      - name: Run tests (Chrome, dart2js and dart2wasm)
        if: matrix.sdk == 'stable'
        run: dart test --platform chrome --compiler dart2js,dart2wasm

      - name: Collect coverage
        if: matrix.sdk == 'stable'
        run: |
          dart pub global activate coverage
          dart pub global run coverage:test_with_coverage

      - name: Upload coverage artifact
        if: matrix.sdk == 'stable'
        uses: actions/upload-artifact@v7
        with:
          name: coverage-lcov
          path: coverage/lcov.info
          if-no-files-found: warn

      - name: pub publish --dry-run
        if: matrix.sdk == 'stable'
        run: dart pub publish --dry-run

  example:
    name: Flutter example
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v6

      - name: Set up Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: example
        run: flutter pub get

      - name: Analyze
        working-directory: example
        run: dart analyze --fatal-infos

      - name: Build example (web)
        working-directory: example
        run: flutter build web --no-tree-shake-icons
