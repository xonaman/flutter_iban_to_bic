include: package:flutter_lints/flutter.yaml

# Kept in sync with the flutter tool's AnalysisOptionsMigration; see the
# root analysis_options.yaml for why.
analyzer:
  exclude:
    - build/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    avoid_print: false
